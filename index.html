<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniCanteen · Centralized Campus Food Ordering</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="left-switcher">
    <a href="customer.html" class="switch-btn" title="Customer view"><i class="fas fa-user-graduate"></i><span>CUSTOMER</span></a>
    <a href="vendor.html" class="switch-btn" title="Vendor admin"><i class="fas fa-store"></i><span>VENDOR</span></a>
    <a href="sysadmin.html" class="switch-btn" title="System admin"><i class="fas fa-user-tie"></i><span>SYSADMIN</span></a>
  </div>

  <div class="main-content" id="main-content">
    <!-- Content will be loaded from respective HTML files -->
    <iframe src="customer.html" frameborder="0" style="width:100%; height:100vh; display:block;" id="content-frame"></iframe>
  </div>

  <script>
    // Update iframe source based on navigation
    document.querySelectorAll('.switch-btn').forEach(link => {
      link.addEventListener('click', function(e) {
        e.preventDefault();
        const href = this.getAttribute('href');
        document.getElementById('content-frame').src = href;
        
        // Update active state
        document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active-view'));
        this.classList.add('active-view');
      });
    });

    // Set initial active state
    window.addEventListener('load', function() {
      const path = window.location.pathname;
      if (path.includes('vendor.html')) {
        document.querySelector('[href="vendor.html"]').classList.add('active-view');
      } else if (path.includes('sysadmin.html')) {
        document.querySelector('[href="sysadmin.html"]').classList.add('active-view');
      } else {
        document.querySelector('[href="customer.html"]').classList.add('active-view');
      }
    });
  </script>
</body>
</html>
